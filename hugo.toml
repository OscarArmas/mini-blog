# Site Configuration
baseURL = 'http://example.org/'
languageCode = 'en'
title = 'Oscar A'
# theme = 'ananke'  # Theme disabled - using custom template

# Taxonomías nativas de Hugo (generan páginas en /categories/ y /tags/)
[taxonomies]
  category = "categories"
  tag = "tags"

# Menu Configuration (optional)
[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 2

# Params Configuration
[params]
  # Author Information
  author = "Oscar A"
  greeting = "Hi, I'm"
  
  # Bio Sections (Edit here to update homepage text)
  bio_intro = "I'm a Staff ML Engineer based in Mexico. I specialize in building infrastructure and services for scaling Startups or Huge Enterprises."
  bio_current = "Currently working at [LexisNexis](https://www.lexisnexis.com/en-us/products/protege.page), focus on MLOps, and RAG Infrastructure."
  bio_footer = "I have worked in high-performance teams on very know companies, and I love sharing knowledge, whether professional or from my projects like [@FakeGuru](https://fakeguru.ai) & [@MiniDrafts](https://minidrafts.com)"
  
  # Section Titles
  projects_title = "Selected Projects"

  # Role Title (used in title tag)
  role_title = "Staff ML Engineer"
  
  # Site Description (SEO)
  description = "Personal blog Specialized in ML, RAG and AI workflows."
  
  # Show recent posts on homepage
  show_recent_posts = true
  
  # Legacy params (kept for compatibility if needed)
  hero_title = "Building High-Scale<br>ML Infrastructure<br>That Ships."
  hero_description = "Specialized in MLOps platforms, RAG, real-time inference systems..."

  # Stats Bar (Legacy)
 [[params.stats]]
   number = "6"
   label = "Years of Experience"
 [[params.stats]]
   number = "20+"
   label = "Projects Completed"
 [[params.stats]]
   number = "3"
   label = "0→1 PLATFORMS"

[caches]
  [caches.images]
    dir = ':cacheDir/images'
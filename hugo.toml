# Site Configuration
# Project site en GitHub Pages. El workflow vuelve a pasar --baseURL con la URL real de Pages.
baseURL = 'https://oscararmas.github.io/mini-blog/'
languageCode = 'en'
title = 'Oscar A'
# theme = 'ananke'  # Theme disabled - using custom template

# Genera /robots.txt desde layouts/robots.txt (incluye la ruta del sitemap).
enableRobotsTXT = true

# Taxonomías nativas de Hugo (generan páginas en /categories/ y /tags/)
[taxonomies]
  category = "categories"
  tag = "tags"

# Menu Configuration (optional)
[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 2

# Params Configuration
[params]
  # Author Information
  author = "Oscar A"
  greeting = "Hi, I'm"
  
  # Bio Sections (Edit here to update homepage text)
  bio_intro = "I'm a Staff ML Engineer based in Mexico. I specialize in building infrastructure and services for scaling Startups or Huge Enterprises."
  bio_current = "Currently working at [LexisNexis](https://www.lexisnexis.com/en-us/products/protege.page), focused on MLOps and RAG infrastructure."
  bio_footer = "I have worked on high-performance teams at well-known companies, and I love sharing knowledge, whether professional or from my projects like [@FakeGuru](https://fakeguru.ai) and [@MiniDrafts](https://minidrafts.com)."

  # Role Title (used in title tag)
  role_title = "Staff ML Engineer"

  # Site Description (SEO)
  description = "Personal blog Specialized in ML, RAG and AI workflows."

  # Imagen por defecto al compartir un enlace (Open Graph, 1200x630, vive en static/).
  # Un post usa la suya con `images` en el front matter.
  images = ["images/page/og-default.png"]

# Secciones de la home, en el orden en que se leen.
# El orden dentro de cada sección lo marca home_order en el front matter.
[[params.home_sections]]
  id = "architecture"
  title = "Architecture & Case Studies"

[[params.home_sections]]
  id = "essays"
  title = "Essays & Thinking"
 
[caches]
  [caches.images]
    dir = ':cacheDir/images'